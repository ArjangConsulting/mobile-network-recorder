# Note: /ios and /android are separate submodule repos, so their swift/gradle
# dependency updates are configured in their own .github/dependabot.yml files
# (ios/.github/dependabot.yml, android/.github/dependabot.yml). This container
# repo only has its own GitHub Actions workflows to keep current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - "*"
